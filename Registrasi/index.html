<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrasi Akun Belajar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="registration-card">
    <header>
      <h1>Registrasi Akun Belajar</h1>
      <p>Lengkapi formulir di bawah ini dengan benar</p>
    </header>

    <form action="#" method="post">
      <label for="nama">Nama Lengkap</label>
      <input id="nama" name="nama" type="text" placeholder="Masukkan nama lengkap" required>

      <label for="email">Alamat Email</label>
      <input id="email" name="email" type="email" placeholder="nama@contoh.com" required>

      <label for="password">Kata Sandi</label>
      <input id="password" name="password" type="password" placeholder="Minimal 8 karakter" minlength="8" required>

      <label for="konfirmasi">Konfirmasi Kata Sandi</label>
      <input id="konfirmasi" name="konfirmasi" type="password" placeholder="Ulangi kata sandi" minlength="8" required>

      <label for="status">Status Pengguna</label>
      <select id="status" name="status" required>
        <option value="" selected disabled>Pilih status</option>
        <option value="siswa">Siswa</option>
        <option value="guru">Guru</option>
        <option value="orang-tua">Orang tua</option>
      </select>

      <button type="submit">Daftar</button>
    </form>
  </main>
</body>
</html>
