
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrasi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="forms">
    <section class="form-card" id="register">
      <h1>Form Registrasi</h1>
      <form action="#" method="post">
        <label class="visually-hidden" for="register-email">Email</label>
        <input id="register-email" type="email" placeholder="Masukkan email" required>
        <label class="visually-hidden" for="register-password">Password</label>
        <input id="register-password" type="password" placeholder="Masukkan password" required>
        <label class="visually-hidden" for="confirm-password">Ulangi password</label>
        <input id="confirm-password" type="password" placeholder="Masukkan ulang password" required>
        <button type="submit">Daftar</button>
      </form>
      <p class="account-prompt">Sudah punya akun? <a href="login.html">Login</a></p>
    </section>
  </main>
</body>
</html>
