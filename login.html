<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="LoginSignup.css">
</head>
<body>
  <main class="forms">
    <section class="form-card" id="login">
      <h1>Form Login</h1>
      <form action="#" method="post">
        <label class="visually-hidden" for="login-email">Email</label>
        <input id="login-email" type="email" placeholder="Masukkan email" required>
        <label class="visually-hidden" for="login-password">Password</label>
        <input id="login-password" type="password" placeholder="Masukkan password" required>
        <p class="form-link"><a href="#">Lupa Password ?</a></p>
        <button type="submit">Login</button>
      </form>
      <p class="account-prompt">Belum punya akun? <a href="signup.html">Daftar</a></p>
    </section>
  </main>
</body>
</html>
